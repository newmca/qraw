<?xml version="1.0" encoding="UTF-8"?>
<!-- Qraw application icon (master). Original artwork, Apache-2.0 like the rest of the project. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="18" y1="10" x2="110" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cf0"/>
      <stop offset="1" stop-color="#1c6fd6"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ff0dc"/>
      <stop offset="1" stop-color="#2fc4b2"/>
    </linearGradient>
  </defs>
  <!-- disc canvas with a soft rim -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="59" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
  <!-- elbow connector with arrowhead -->
  <path d="M58 44 H80 V66" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M70 64 L80 82 L90 64 Z" fill="#ffffff"/>
  <!-- source node: circle -->
  <circle cx="42" cy="44" r="17" fill="#ffffff"/>
  <!-- target node: rounded rectangle -->
  <rect x="58" y="88" width="44" height="24" rx="8" fill="url(#teal)"/>
</svg>
